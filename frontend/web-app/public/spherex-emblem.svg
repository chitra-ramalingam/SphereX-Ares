<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="irsaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="50" cy="50" r="48" fill="url(#spaceGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Astrometric Coordinate Grid lines -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#334155" stroke-dasharray="2,2" stroke-width="0.8" />
  <circle cx="50" cy="50" r="16" fill="none" stroke="#334155" stroke-dasharray="2,2" stroke-width="0.8" />
  <line x1="50" y1="6" x2="50" y2="94" stroke="#1e293b" stroke-width="1" />
  <line x1="6" y1="50" x2="94" y2="50" stroke="#1e293b" stroke-width="1" />

  <!-- SPHEREx Telescope / Multi-spectral Hexagon Symbol -->
  <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" fill="none" stroke="url(#irsaGrad)" stroke-width="2.5" />
  
  <!-- Optical Focal Axis & Infrared Detector Beam -->
  <circle cx="50" cy="50" r="6" fill="#38bdf8" />
  <circle cx="50" cy="50" r="2.5" fill="#ffffff" />
  <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,3" transform="rotate(-28 50 50)" opacity="0.85" />
  
  <!-- Moving Target Indicator (Planet X / Brown Dwarf) -->
  <circle cx="78" cy="34" r="3.5" fill="#f59e0b" />
  <line x1="78" y1="34" x2="88" y2="30" stroke="#f59e0b" stroke-width="1.5" />
</svg>
